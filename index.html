<!DOCTYPE html>
<html>
<head>
  <title>Google OAuth Redirect</title>
  <meta charset="utf-8" />
</head>

<body style="font-family:Consolas, monospace; padding:40px; background:#f5f5f5;">
  <h2>Google OAuth Redirect Page</h2>

  <p id="debug">Waiting for Google OAuth data...</p>

  <script>
    // Parse the Google OAuth redirect query string
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const error_description = params.get("error_description");

    // Show debug information in browser
    document.getElementById("debug").innerText =
      `code=${code || "(none)"} | error=${error || "(none)"} | desc=${error_description || "(none)"}`;

    // Send to opener (the SPFx popup)
    if (window.opener) {
      window.opener.postMessage(
        {
          provider: "google",
          result: { code, error, error_description }
        },
        "*"
      );
    }

    // Automatically close the window
    setTimeout(() => window.close(), 200);
  </script>
</body>
</html>
